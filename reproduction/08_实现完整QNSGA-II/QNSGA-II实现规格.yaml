步骤: 8
MATLAB入口: 第2篇代码 - 静态算法对比/initial_NSGA-II/initial_INSGA_II.m
编码: 五段_OS_MS_AS_空载速度_负载速度
初始化: 40_30_30混合初始化
种群规模: 默认100
最大代数: 默认200
交叉概率: 0.8
变异概率: 0.1
邻域:
  N1: 相邻两个OS倒序后插入
  N2: 删除两个OS并按取出顺序整体插入
  N3: 最多尝试10次寻找多候选机器工序并换机
  N4: 从加工工序数最多机器选工序_改为候选集合中当前负载最小机器的索引
  N5: 随机改变一个AS基因且保证不同
  N6: 使用最长合格等待区间AGV替换另一AGV最早合格空载任务
Q_learning:
  Q表形状: [4, 6]
  初始值: 0
  学习率: 0.1
  折扣因子: 0.9
  状态: 两目标全种群中位数形成四象限_等于中位数归入较小侧
  epsilon: 1除以_1加exp负的_8乘gen加1除以max_gen减3
  随机条件: rand大于epsilon或当前Q行全零
  利用条件: 否则选择当前Q行第一个最大值动作
  接纳: 旧解不弱支配新解时进入候选集
  更新: 所有邻域尝试均更新Q表
停止: 代数
输出: [Pareto目标, Pareto染色体, Q表, 每代最小值, 每代平均值, 评价次数, 随机种子]
验收:
  Gate2: 完整通过
  Gate5: 完整通过
