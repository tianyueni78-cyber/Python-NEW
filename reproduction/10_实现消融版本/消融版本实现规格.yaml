阶段: 10
版本:
  A:
    名称: 基础NSGA-II
    matlab_entry: 第2篇代码 - 静态算法对比/NSGA-II/NSGA2.m
    初始化: random
    邻域: none
    动作: none
    Q更新: false
  B:
    名称: 混合初始化NSGA-II
    matlab_entry: 第2篇代码 - 静态算法对比/Multi-NSGA-II/initial_INSGA_II.m
    初始化: hybrid
    邻域: none
    动作: none
    Q更新: false
  C:
    名称: 随机邻域NSGA-II
    matlab_entry: 第2篇代码 - 静态算法对比/QNSGA-II/initial_INSGA_II.m
    初始化: hybrid
    邻域: N1-N6
    动作: uniform_random
    Q更新: false
  full:
    名称: 完整QNSGA-II
    matlab_entry: 第2篇代码 - 静态算法对比/initial_NSGA-II/initial_INSGA_II.m
    初始化: hybrid
    邻域: N1-N6
